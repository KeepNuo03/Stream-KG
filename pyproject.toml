[project]
name = "stream-kg"
version = "0.1.0"
description = "Incremental personal knowledge graph with RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "qdrant-client>=1.14,<1.15",
    "networkx>=3.4,<4.0",
    "httpx>=0.28,<1.0",
    "trafilatura>=2.0,<3.0",
    "aiosqlite>=0.21,<1.0",
    "sse-starlette>=2.2,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "numpy>=2.2,<3.0",
    "pypdf>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0",
]
gpu = [
    "torch>=2.6,<3.0",
    "transformers>=4.48,<5.0",
    "sentence-transformers>=3.4,<4.0",
    "modelscope>=1.20,<2.0",
]
mineru = [
    "mineru[pipeline]>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stream_kg", "api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stream_kg", "api"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
