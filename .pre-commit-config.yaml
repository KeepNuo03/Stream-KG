repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: unit tests
        entry: uv run pytest tests/unit/ -q
        language: system
        pass_filenames: false
        stages: [pre-push]
